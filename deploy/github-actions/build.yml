# Copy this file to .github/workflows/build-group-chat.yml in the repository that contains this project.
# It builds on GitHub's amd64 runner; do not run either Docker build on feedmob2/feedmob3.
name: build-openclaw-group-chat

on:
  workflow_dispatch:
  push:
    paths:
      - "platform/**"
      - "plugins/feedmob-group-chat/**"
      - "deploy/github-actions/build.yml"

permissions:
  contents: read
  packages: write

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./platform
          file: ./platform/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/feedmob-openclaw-group-platform:latest

  openclaw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./plugins/feedmob-group-chat
          file: ./plugins/feedmob-group-chat/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/feedmob-openclaw-group-chat:latest
