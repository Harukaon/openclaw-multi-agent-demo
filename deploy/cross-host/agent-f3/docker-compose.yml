services:
  openclaw-agent-b:
    image: ${OPENCLAW_GROUP_IMAGE:-ghcr.io/harukaon/feedmob-openclaw-group-chat:latest}
    container_name: openclaw-group-agent-b
    restart: unless-stopped
    init: true
    mem_limit: 768m
    mem_reservation: 512m
    env_file:
      - .env
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN_B:?set OPENCLAW_GATEWAY_TOKEN_B in .env}
      FEEDMOB_GROUP_SERVER_URL: ${FEEDMOB_GROUP_SERVER_URL:-https://groupchat-test.feedmob.it.com}
      FEEDMOB_GROUP_AGENT_ID: ${FEEDMOB_GROUP_AGENT_ID_B:?set FEEDMOB_GROUP_AGENT_ID_B in .env}
      FEEDMOB_GROUP_AGENT_TOKEN: ${FEEDMOB_GROUP_AGENT_TOKEN_B:?set FEEDMOB_GROUP_AGENT_TOKEN_B in .env}
      FEEDMOB_OPENCLAW_AGENT_ID: ${FEEDMOB_OPENCLAW_AGENT_ID_B:-main}
    ports:
      - "127.0.0.1:18790:18789"
    volumes:
      - ./state/agent-b:/home/node/.openclaw
      - ./config/agent-b/openclaw.json:/home/node/.openclaw/openclaw.json:ro
    command:
      - sh
      - -lc
      - |
        node /opt/camofox-plugin/dist/src/server.js >>/tmp/camofox-server.log 2>&1 &
        exec openclaw gateway --bind lan --port 18789

  openclaw-agent-c:
    image: ${OPENCLAW_GROUP_IMAGE:-ghcr.io/harukaon/feedmob-openclaw-group-chat:latest}
    container_name: openclaw-group-agent-c
    restart: unless-stopped
    init: true
    mem_limit: 768m
    mem_reservation: 512m
    env_file:
      - .env
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN_C:?set OPENCLAW_GATEWAY_TOKEN_C in .env}
      FEEDMOB_GROUP_SERVER_URL: ${FEEDMOB_GROUP_SERVER_URL:-https://groupchat-test.feedmob.it.com}
      FEEDMOB_GROUP_AGENT_ID: ${FEEDMOB_GROUP_AGENT_ID_C:?set FEEDMOB_GROUP_AGENT_ID_C in .env}
      FEEDMOB_GROUP_AGENT_TOKEN: ${FEEDMOB_GROUP_AGENT_TOKEN_C:?set FEEDMOB_GROUP_AGENT_TOKEN_C in .env}
      FEEDMOB_OPENCLAW_AGENT_ID: ${FEEDMOB_OPENCLAW_AGENT_ID_C:-main}
    ports:
      - "127.0.0.1:18791:18789"
    volumes:
      - ./state/agent-c:/home/node/.openclaw
      - ./config/agent-c/openclaw.json:/home/node/.openclaw/openclaw.json:ro
    command:
      - sh
      - -lc
      - |
        node /opt/camofox-plugin/dist/src/server.js >>/tmp/camofox-server.log 2>&1 &
        exec openclaw gateway --bind lan --port 18789
