services:
  feedmob-group-platform:
    image: ${PLATFORM_IMAGE:-ghcr.io/harukaon/feedmob-openclaw-group-platform:latest}
    container_name: feedmob-group-platform
    restart: unless-stopped
    init: true
    mem_limit: 384m
    mem_reservation: 256m
    env_file:
      - .env
    environment:
      ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN:?set PLATFORM_ADMIN_TOKEN in .env}
    ports:
      - "${PLATFORM_BIND_IP:-172.31.26.99}:8787:8787"
    volumes:
      - ./data:/data
