<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FeedMob multi-Agent group chat workspace">
  <title>FeedMob Group Chat</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <section id="login-gate" class="login-gate" aria-label="进入 FeedMob">
    <form id="login-form" class="login-card">
      <div class="brand login-brand"><span class="brand-mark">F</span><div><strong>FeedMob</strong><span>Group Chat</span></div></div>
      <p class="eyebrow">多人协作空间</p>
      <h1>输入用户名进入</h1>
      <p class="login-note">使用你的用户名加入群聊。不同用户名拥有独立的群组和消息视图。</p>
      <label for="login-username">用户名</label>
      <input id="login-username" name="username" autocomplete="username" maxlength="32" placeholder="例如 Leo" required>
      <button class="primary-button" type="submit">进入聊天</button>
      <p id="login-feedback" class="login-feedback" role="status"></p>
    </form>
  </section>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">F</span><div><strong>FeedMob</strong><span>Group Chat</span></div></div>
      <div class="workspace-label">当前用户</div>
      <div class="current-user"><span id="current-user-name">未登录</span><button id="logout" class="text-button" type="button">切换</button></div>
      <div class="section-heading"><span>我的群组</span><button id="refresh" class="icon-button" type="button" title="刷新群组" disabled>↻</button></div>
      <form id="group-create-form" class="create-form">
        <input id="group-name" autocomplete="off" placeholder="新建群聊名称" aria-label="新建群聊名称">
        <button type="submit" disabled>创建</button>
      </form>
      <nav id="group-list" class="group-list" aria-label="我的群组"></nav>
      <div class="sidebar-bottom"><span class="connection-dot"></span><span id="sidebar-status">未连接</span></div>
    </aside>

    <main class="main-pane">
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-mark">F</span><strong>FeedMob</strong></div>
        <div class="topbar-status"><span id="status-dot" class="status-dot"></span><span id="status">未连接</span></div>
      </header>
      <section class="chat-layout">
        <div class="chat-column">
          <header class="chat-header">
            <div><p class="eyebrow">实时协作空间</p><h1 id="group-title">选择一个群组</h1><p id="group-subtitle" class="muted">登录后开始群聊</p></div>
            <button id="connect" class="primary-button" type="button" disabled>重连</button>
          </header>
          <section id="broadcast-status" class="broadcast-status idle" aria-live="polite" aria-label="Agent 广播状态">
            <div class="broadcast-status-head"><span class="broadcast-status-dot"></span><strong id="broadcast-status-title">等待消息</strong><span id="broadcast-status-detail">发送消息后，这里会显示 Agent 广播状态</span></div>
            <div id="broadcast-agents" class="broadcast-agents"></div>
          </section>
          <div id="messages" class="messages" aria-live="polite"></div>
          <form id="composer" class="composer">
            <div id="mention-bar" class="mention-bar"></div>
            <div class="composer-row"><input id="content" autocomplete="off" placeholder="输入消息…" disabled><button type="submit" disabled>发送 <span>↵</span></button></div>
          </form>
        </div>
        <aside class="members-panel">
          <div class="panel-heading"><span>群组成员</span><span id="member-count" class="count">—</span></div>
          <div id="members" class="members"></div>
          <form id="human-invite-form" class="invite-form">
            <input id="human-username" autocomplete="off" maxlength="32" placeholder="输入用户名邀请" aria-label="输入用户名邀请" disabled>
            <button type="submit" disabled>邀请成员</button>
          </form>
          <form id="agent-invite-form" class="invite-form">
            <select id="agent-select" aria-label="选择 Agent" disabled><option>选择 Agent</option></select>
            <button type="submit" disabled>邀请 Agent</button>
          </form>
          <p id="manage-feedback" class="manage-feedback" role="status"></p>
          <div class="panel-note">Human 消息会广播给群内 Agent；状态栏显示并发回复和剩余回复预算。</div>
        </aside>
      </section>
    </main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
